<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>灵宝AI-Demo演示界面</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5fbff;
      --muted: rgba(224, 239, 255, .66);
      --cyan: #76f1ff;
      --violet: #bda4ff;
      --pink: #ffaddd;
      --line: rgba(167, 223, 255, .34);
      --line-bright: rgba(214, 246, 255, .72);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-width: 1080px;
      min-height: 680px;
      overflow: hidden;
      background: #ffffff;
      isolation: isolate;
    }

    .aurora {
      position: absolute;
      inset: -12%;
      z-index: 0;
      background:
        linear-gradient(110deg, transparent 16%, rgba(118,241,255,.12) 35%, rgba(189,164,255,.15) 50%, transparent 68%),
        radial-gradient(ellipse at 30% 68%, rgba(118,241,255,.15), transparent 28%),
        radial-gradient(ellipse at 76% 28%, rgba(255,173,221,.12), transparent 26%);
      filter: blur(28px);
      animation: auroraBreath 7s ease-in-out infinite;
      pointer-events: none;
      display: none;
    }

    .lens {
      position: absolute;
      left: 5.8vw;
      right: 5.8vw;
      top: 8vh;
      bottom: 9vh;
      z-index: 2;
      border: 0;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.016), rgba(255,255,255,.006)),
        rgba(3, 8, 18, .42);
      box-shadow:
        inset 0 0 70px rgba(118,241,255,.035),
        0 0 42px rgba(118,241,255,.045);
      pointer-events: none;
      display: none;
    }

    .lens::before {
      content: none;
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(167, 223, 255, .16);
      border-radius: 14px;
    }

    .lens::after {
      content: none;
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(118,241,255,.45), transparent);
      opacity: .68;
    }

    .brand {
      position: absolute;
      left: 9.2vw;
      top: 11.2vh;
      z-index: 5;
      display: flex;
      gap: 12px;
      align-items: center;
      color: rgba(235, 248, 255, .76);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .14em;
      display: none;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 16px rgba(118,241,255,.85);
    }

    .corner-info {
      position: absolute;
      right: 9.2vw;
      top: 11.4vh;
      z-index: 5;
      color: rgba(224, 239, 255, .58);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .36em;
      display: none;
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      place-items: center;
      padding: 10vh 9vw 12vh;
      opacity: 0;
      transform: translateY(8px) scale(.99);
      pointer-events: none;
      transition: opacity .55s ease, transform .55s ease;
    }

    .scene.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .scene.closing {
      opacity: 1;
      pointer-events: none;
    }

    .scene.closing .content {
      animation: tvClose .92s cubic-bezier(.62, 0, .2, 1) forwards;
      transform-origin: center;
    }

    .scene.closing .content > * {
      animation: contentFade .42s ease forwards;
    }

    .scene.closing .content::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 2px;
      transform: translateY(-50%) scaleX(0);
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.98), rgba(118,241,255,.92), transparent);
      box-shadow: 0 0 28px rgba(118,241,255,.62), 0 0 42px rgba(255,255,255,.34);
      animation: closeLine .92s cubic-bezier(.62, 0, .2, 1) forwards;
      pointer-events: none;
    }

    .scene.plain {
      display: block;
      padding: 0;
      background: #ffffff;
    }

    .ip-zone {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(260px, 21vw, 390px);
      height: clamp(260px, 21vw, 390px);
      display: grid;
      place-items: start;
      padding-left: clamp(34px, 5.2vw, 86px);
      padding-top: clamp(30px, 5vw, 76px);
      pointer-events: auto;
    }

    .plain-ip {
      position: relative;
      width: clamp(76px, 6.2vw, 104px);
      height: clamp(76px, 6.2vw, 104px);
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,.96), rgba(255,255,255,.58) 30%, transparent 64%),
        linear-gradient(145deg, rgba(255,255,255,.78), rgba(232,238,247,.42));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.96),
        inset 0 -14px 26px rgba(202, 213, 226, .18),
        0 16px 42px rgba(21, 31, 44, .10),
        0 0 28px rgba(255, 255, 255, .72);
      backdrop-filter: blur(18px) saturate(1.28);
      -webkit-backdrop-filter: blur(18px) saturate(1.28);
      cursor: pointer;
      opacity: 0;
      transform: translateX(-132px) scale(.96);
      transition:
        opacity .42s ease,
        border-color .28s ease,
        box-shadow .28s ease,
        transform .58s cubic-bezier(.22, 1, .36, 1);
    }

    .plain-ip::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background:
        linear-gradient(135deg, rgba(255,255,255,.62), transparent 42%),
        radial-gradient(circle at 78% 82%, rgba(255, 184, 229, .20), transparent 34%),
        radial-gradient(circle at 18% 74%, rgba(118, 241, 255, .18), transparent 38%);
      pointer-events: none;
    }

    .ip-zone:hover .plain-ip,
    .plain-ip.in-use {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .plain-ip img {
      position: relative;
      z-index: 1;
      width: 92%;
      height: 92%;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(18, 24, 32, .10));
      transition: opacity .32s ease, transform .32s ease;
    }

    .voice-wave {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(.86);
      transition: opacity .34s ease, transform .42s cubic-bezier(.22, 1, .36, 1);
      pointer-events: none;
    }

    .voice-wave svg {
      width: 66%;
      height: 66%;
      overflow: visible;
      filter:
        drop-shadow(0 0 8px rgba(255, 108, 222, .46))
        drop-shadow(0 0 12px rgba(118, 241, 255, .42));
    }

    .voice-wave path {
      fill: none;
      stroke: url(#waveGradient);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 34 18;
      animation: waveFlow 1.1s linear infinite, waveBreath 1.35s ease-in-out infinite;
    }

    .voice-wave .wave-echo {
      stroke-width: 13;
      opacity: .18;
      stroke-dasharray: none;
      animation: waveBreath 1.35s ease-in-out infinite reverse;
    }

    .plain-ip.listening-wave img {
      opacity: 0;
      transform: scale(.72);
    }

    .plain-ip.listening-wave .voice-wave {
      opacity: 1;
      transform: scale(1);
    }

    .plain-ip.recording {
      border-color: rgba(118, 241, 255, .86);
      box-shadow:
        inset 0 1px 10px rgba(255,255,255,.92),
        0 16px 42px rgba(21, 31, 44, .10),
        0 0 0 8px rgba(118, 241, 255, .08),
        0 0 36px rgba(118, 241, 255, .30);
      transform: scale(1.03);
    }

    .plain-ip.processing {
      border-color: rgba(180, 136, 255, .82);
      box-shadow:
        inset 0 1px 10px rgba(255,255,255,.92),
        0 16px 42px rgba(21, 31, 44, .10),
        0 0 0 8px rgba(180, 136, 255, .08),
        0 0 36px rgba(180, 136, 255, .28);
      transform: scale(1.03);
    }

    .plain-ip.recording::after {
      content: "";
      position: absolute;
      inset: -12px;
      border: 1px solid rgba(118, 241, 255, .36);
      border-radius: 50%;
      animation: recordPulse 1.55s ease-out infinite;
      pointer-events: none;
    }

    .ai-bubble {
      position: absolute;
      left: clamp(138px, 11vw, 176px);
      top: clamp(52px, 5.8vw, 92px);
      min-width: 158px;
      max-width: min(420px, 34vw);
      min-height: 58px;
      display: grid;
      align-items: center;
      padding: 16px 22px 16px 24px;
      border: 1px solid rgba(255,255,255,.68);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.76), rgba(242,246,252,.46)),
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.92), transparent 34%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.96),
        inset 0 -12px 24px rgba(200, 212, 226, .14),
        0 18px 46px rgba(26, 34, 46, .10),
        0 0 36px rgba(118, 241, 255, .06);
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      color: rgba(38, 48, 64, .82);
      font-size: clamp(14px, 1.08vw, 18px);
      line-height: 1.55;
      letter-spacing: 0;
      opacity: 0;
      transform: translateX(-18px) scale(.94);
      pointer-events: none;
      transition:
        opacity .34s ease,
        transform .48s cubic-bezier(.22, 1, .36, 1);
    }

    .ai-bubble::before {
      content: "";
      position: absolute;
      left: -17px;
      top: 24px;
      width: 34px;
      height: 26px;
      border-radius: 999px 0 0 999px;
      background: inherit;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.78);
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
      opacity: .86;
    }

    .ai-bubble.visible {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .bubble-text {
      position: relative;
      z-index: 1;
    }

    .thinking-dots {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 112px;
      justify-content: center;
    }

    .thinking-dots i {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff7b27, #ff3f2f);
      box-shadow: 0 5px 12px rgba(255, 91, 35, .28), inset 0 1px 2px rgba(255,255,255,.6);
      animation: dotBounce 1.05s ease-in-out infinite;
    }

    .thinking-dots i:nth-child(2) {
      background: linear-gradient(145deg, #ff7c3f, #ff5b5b);
      animation-delay: .12s;
    }

    .thinking-dots i:nth-child(3) {
      background: linear-gradient(145deg, #ff6ee8, #9b7cff);
      animation-delay: .24s;
    }

    .device-stack {
      position: absolute;
      right: 0;
      top: 24vh;
      bottom: 3vh;
      width: clamp(250px, 22vw, 390px);
      display: grid;
      align-items: end;
      justify-items: end;
      padding: 0 clamp(34px, 6vw, 96px) clamp(34px, 6vh, 82px) 24px;
      overflow: hidden;
      cursor: default;
    }

    .device-stack {
      display: grid;
      gap: clamp(6px, .75vw, 12px);
      justify-items: end;
      pointer-events: auto;
    }

    .device-item {
      position: relative;
      width: clamp(72px, 7vw, 118px);
      height: clamp(72px, 7vw, 118px);
      opacity: 0;
      transform: translateX(132px) scale(.96);
      transition:
        opacity .42s ease,
        transform .58s cubic-bezier(.22, 1, .36, 1);
    }

    .device-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 14px 26px rgba(20, 30, 42, .12));
      transition:
        transform .34s cubic-bezier(.22, 1, .36, 1),
        filter .42s ease;
    }

    .device-item:nth-child(1) { transition-delay: 0s; }
    .device-item:nth-child(2) { transition-delay: .06s; }
    .device-item:nth-child(3) { transition-delay: .12s; }

    .device-stack:hover .device-item,
    .device-stack:focus-within .device-item {
      opacity: .92;
      transform: translateX(0) scale(1);
    }

    .device-stack:hover .device-item:nth-child(1),
    .device-stack:focus-within .device-item:nth-child(1) { transition-delay: .04s; }
    .device-stack:hover .device-item:nth-child(2),
    .device-stack:focus-within .device-item:nth-child(2) { transition-delay: .12s; }
    .device-stack:hover .device-item:nth-child(3),
    .device-stack:focus-within .device-item:nth-child(3) { transition-delay: .20s; }

    .device-item:hover {
      transform: translateX(-22px) scale(1.03);
      opacity: 1;
    }

    .device-item:hover .device-icon {
      transform: scale(1.04);
      filter:
        drop-shadow(0 14px 28px rgba(20, 30, 42, .14))
        drop-shadow(0 0 18px rgba(118, 241, 255, .42))
        drop-shadow(0 0 38px rgba(118, 241, 255, .20))
        saturate(1.2);
    }

    .content {
      position: relative;
      width: min(690px, 44vw);
      min-height: min(520px, 64vh);
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 20px;
      padding: 38px 44px 34px;
      overflow: hidden;
      border: 1px solid rgba(218, 226, 255, .22);
      border-radius: 12px;
      background:
        radial-gradient(circle at 50% 38%, rgba(113, 183, 255, .22), transparent 45%),
        radial-gradient(circle at 82% 10%, rgba(180, 136, 255, .18), transparent 38%),
        linear-gradient(145deg, rgba(23, 39, 60, .85), rgba(18, 19, 42, .85));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.34),
        inset 0 0 58px rgba(206, 224, 255, .12),
        inset 0 -32px 74px rgba(7, 10, 26, .38),
        0 30px 78px rgba(13, 18, 38, .34),
        0 0 48px rgba(126, 181, 255, .14),
        0 0 0 1px rgba(255,255,255,.07);
      backdrop-filter: blur(26px) saturate(1.24);
      -webkit-backdrop-filter: blur(26px) saturate(1.24);
      animation: panelBreath 4.8s ease-in-out infinite;
    }

    .content::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.07);
      background:
        linear-gradient(135deg, rgba(255,255,255,.22), transparent 18% 76%, rgba(166,122,255,.12)),
        linear-gradient(180deg, rgba(255,255,255,.07), transparent 42%);
      pointer-events: none;
      opacity: .9;
    }

    .content > * {
      position: relative;
      z-index: 1;
    }

    .ip-wrap {
      position: relative;
      width: 248px;
      height: 248px;
      display: grid;
      place-items: center;
    }

    .ip-wrap::before,
    .ip-wrap::after {
      content: none;
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, transparent 0 16%, rgba(118,241,255,.82) 18%, transparent 22%, transparent 58%, rgba(255,173,221,.55) 62%, transparent 68%),
        radial-gradient(circle, transparent 59%, rgba(214,246,255,.26) 60% 61%, transparent 62% 70%, rgba(214,246,255,.16) 71% 72%, transparent 73%);
      mask-image: radial-gradient(circle, transparent 0 57%, black 58% 72%, transparent 73%);
      opacity: .62;
      animation: ring 16s linear infinite, ringBreath 4.4s ease-in-out infinite;
    }

    .ip-wrap::after {
      inset: 12%;
      opacity: .34;
      animation-duration: 22s;
      animation-direction: reverse;
    }

    .glow {
      position: absolute;
      inset: 24%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.42), rgba(118,241,255,.18) 40%, rgba(166,122,255,.10) 58%, transparent 72%);
      filter: blur(18px);
      animation: glow 4s ease-in-out infinite;
    }

    .star-field {
      position: absolute;
      inset: -70px;
      z-index: 1;
      pointer-events: none;
      overflow: visible;
    }

    .star-field i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--star);
      box-shadow:
        0 0 10px var(--star),
        0 0 22px color-mix(in srgb, var(--star), transparent 35%);
      transform: translate(-50%, -50%) scale(.32);
      opacity: 0;
      animation: starDrift var(--duration) ease-out infinite;
      animation-delay: var(--delay);
    }

    .star-field i::before,
    .star-field i::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: inherit;
      border-radius: 999px;
      opacity: .78;
    }

    .star-field i::before {
      width: calc(var(--size) * 5.8);
      height: 1px;
    }

    .star-field i::after {
      width: 1px;
      height: calc(var(--size) * 5.8);
    }

    .breath-orb {
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 1px solid rgba(214,246,255,.12);
      background: radial-gradient(circle, transparent 54%, rgba(118,241,255,.08) 55% 58%, transparent 59%);
      animation: expandBreath 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    .lingbao {
      position: relative;
      z-index: 2;
      width: 156px;
      height: 156px;
      object-fit: contain;
      filter: drop-shadow(0 0 22px rgba(118,241,255,.28)) drop-shadow(0 0 28px rgba(255,173,221,.18));
      animation: floaty 3.8s ease-in-out infinite;
    }

    .wake-pill {
      min-width: 124px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0 20px;
      border: 1px solid rgba(214,246,255,.52);
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(118,241,255,.10);
    }

    h1,
    p { margin: 0; }

    .copy {
      min-height: 1.25em;
      text-align: center;
      color: var(--ink);
      font-size: clamp(30px, 3.4vw, 48px);
      line-height: 1.22;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 0 18px rgba(118,241,255,.22);
    }

    .support {
      min-height: 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
      letter-spacing: .06em;
    }

    .typing::after {
      content: "";
      display: inline-block;
      width: .44em;
      height: .95em;
      margin-left: 4px;
      transform: translateY(.12em);
      border-radius: 1px;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(118,241,255,.62);
      animation: caret .86s steps(2) infinite;
    }

    .name-panel {
      width: min(560px, 100%);
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 22px 28px 24px;
      border: 1px solid rgba(226,239,255,.38);
      border-radius: 14px;
      background:
        linear-gradient(145deg, rgba(31, 49, 73, .85), rgba(22, 20, 48, .85)),
        radial-gradient(circle at 18% 6%, rgba(255,255,255,.18), transparent 32%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.30),
        inset 0 0 30px rgba(201,220,255,.10),
        0 18px 46px rgba(6, 10, 22, .30),
        0 0 26px rgba(126,181,255,.12);
      backdrop-filter: blur(22px) saturate(1.2);
      -webkit-backdrop-filter: blur(22px) saturate(1.2);
    }

    .name-row {
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr);
      align-items: end;
      gap: 14px;
      font-size: clamp(20px, 2.4vw, 28px);
      font-weight: 900;
    }

    input {
      width: 100%;
      border: 0;
      border-bottom: 2px solid rgba(214,246,255,.66);
      outline: none;
      background: transparent;
      color: var(--ink);
      font: inherit;
      line-height: 1.25;
      text-align: center;
      padding: 4px 8px 8px;
      user-select: text;
    }

    input::placeholder { color: rgba(224,239,255,.34); }
    input:focus { border-bottom-color: var(--cyan); box-shadow: 0 14px 18px -18px var(--cyan); }

    .status {
      min-height: 22px;
      color: rgba(224,239,255,.58);
      font-size: 13px;
    }

    .confirm-name {
      color: #ffffff;
      text-shadow: 0 0 20px rgba(118,241,255,.34);
    }

    .bottom-hint {
      position: absolute;
      left: 50%;
      bottom: 12.5vh;
      z-index: 5;
      transform: translateX(-50%);
      color: rgba(224,239,255,.46);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .42em;
      pointer-events: none;
      display: none;
    }

    .bottom-hint::before,
    .bottom-hint::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 92px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(118,241,255,.45), transparent);
      animation: lineBreath 3s ease-in-out infinite;
      display: none;
    }

    .bottom-hint::before { right: calc(100% + 22px); }
    .bottom-hint::after { left: calc(100% + 22px); }

    @keyframes auroraBreath {
      0%, 100% { opacity: .58; transform: scale(1); }
      50% { opacity: .95; transform: scale(1.06) translateY(-1vh); }
    }

    @keyframes ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes glow {

    @keyframes expandBreath {

    @keyframes floaty {

    @keyframes caret {

    @keyframes lineBreath {

<body>

                  <stop offset="0" stop-color="#ff7a45"/>

              </defs>
              <path class="wave-echo" d="M16 63 C27 63 27 49 36 49 C47 49 43 85 55 85 C68 85 61 30 75 30 C86 30 84 63 94 63 C100 63 104 62 108 62"/>

  </main>

  <script src="voice_config.local.js"></script>
  <script src="native_bridge.js"></script>
  <script>
    const scenes = {
      wake: document.getElementById("wakeScene"),
      intro: document.getElementById("introScene"),
      name: document.getElementById("nameScene"),
      confirm: document.getElementById("confirmScene"),
      plain: document.getElementById("plainScene")
    };

    const urlParams = new URLSearchParams(window.location.search);
    const DEMO_MODE = urlParams.get('mode') || 'cache';
    console.log('Demo mode:', DEMO_MODE);

    const input = document.getElementById("nameInput");
    const statusText = document.getElementById("statusText");
    const confirmName = document.getElementById("confirmName");
    const confirmTyped = document.getElementById("confirmTyped");
    const plainIp = document.getElementById("plainIp");
    const plainIpImage = document.getElementById("plainIpImage");
    const voiceWave = document.getElementById("voiceWave");
    const aiBubble = document.getElementById("aiBubble");
    const thinkingDots = document.getElementById("thinkingDots");
    const bubbleText = document.getElementById("bubbleText");
    let inputTimer = null;
    let sequenceTimers = [];
    let typingTimers = [];
    let selectedVoice = null;
    let cloudAudio = null;
    let processingTimer = null;
    let answerTimer = null;
    let listeningWaveTimer = null;

    document.querySelectorAll(".ip-wrap").forEach((wrap, wrapIndex) => {
      const field = document.createElement("div");
      field.className = "star-field";
      const stars = 28;
      for (let i = 0; i < stars; i += 1) {
        const star = document.createElement("i");
        const angle = (360 / stars) * i + (wrapIndex * 9) + ((i % 3) * 5);
        const distance = 82 + ((i * 17) % 106);
        const size = 2 + ((i * 5) % 10) / 3;
        const color = i % 3 === 0 ? "#9be7ff" : i % 3 === 1 ? "#d6c1ff" : "#ffffff";
        star.style.setProperty("--angle", `${angle}deg`);
        star.style.setProperty("--distance", `${distance}px`);
        star.style.setProperty("--size", `${size}px`);
        star.style.setProperty("--star", color);
        star.style.setProperty("--duration", `${2.9 + (i % 5) * .34}s`);
        star.style.setProperty("--delay", `${(i % 7) * -.42}s`);
        field.appendChild(star);
      }
      wrap.insertBefore(field, wrap.firstChild);
    });

    const speechLines = {
      wake: "灵宝AI，系统已唤醒。",
      intro: "我是您的专属AI管家，灵宝。",
      name: "您希望我称呼您为",
      confirm: () => {
        const title = input.value.trim() || getStoredName() || confirmName.textContent || "领导";
        return `好的，${title}。灵宝已记住这个称呼。`;
      }
    };

    const cloudVoice = {
      wake: "voice_samples/lingbao_wake.mp3",
      intro: "voice_samples/lingbao_intro_simple.mp3",
      name: "voice_samples/lingbao_name.mp3",
      confirm: "voice_samples/lingbao_confirm_leader.mp3"
    };

    const volcengineTts = {
      apiKey: window.LINGBAO_TTS_CONFIG?.apiKey || "",
      appKey: "aGjiRDfUWi",
      resourceId: "seed-tts-2.0",
      speaker: "zh_female_cancan_uranus_bigtts"
    };

    function clearTyping() {
      typingTimers.forEach(timer => window.clearTimeout(timer));
      typingTimers = [];
      document.querySelectorAll(".typing").forEach(node => node.classList.remove("typing"));
    }

    function typeInto(node, text, delay = 42) {
      node.textContent = "";
      node.classList.add("typing");
      [...text].forEach((char, index) => {
        typingTimers.push(window.setTimeout(() => {
          node.textContent += char;
          if (index === [...text].length - 1) node.classList.remove("typing");
        }, index * delay));
      });
    }

    function typeScene(sceneName) {
      clearTyping();
      const scene = scenes[sceneName];
      if (!scene) return;
      scene.querySelectorAll("[data-type]").forEach((node, nodeIndex) => {
        typingTimers.push(window.setTimeout(() => typeInto(node, node.dataset.type || ""), nodeIndex * 180));
      });
      if (sceneName === "confirm") {
        confirmName.textContent = "";
        const title = input.value.trim() || getStoredName() || "领导";
        const fullText = `好的，${title}`;
        typeInto(confirmTyped, fullText);
        typingTimers.push(window.setTimeout(() => {
          confirmTyped.classList.remove("typing");
          confirmTyped.textContent = "好的，";
          confirmName.textContent = title;
        }, fullText.length * 42 + 90));
      }
    }

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      selectedVoice =
        voices.find(voice => /zh|cmn|Chinese|普通话|中文/i.test(`${voice.lang} ${voice.name}`) && /female|woman|xiaoxiao|xiaoyi|huihui|tingting|yaoyao|mei|女/i.test(voice.name)) ||
        voices.find(voice => /zh|cmn|Chinese|普通话|中文/i.test(`${voice.lang} ${voice.name}`)) ||
        voices[0] ||
        null;
    }

    function speakScene(sceneName) {
      stopAudio();
      const title = input.value.trim() || getStoredName() || confirmName.textContent || "领导";
      if (sceneName === "confirm" && volcengineTts.apiKey) {
        speakWithVolcano(`好的，${title}。灵宝已记住这个称呼。`, () => speakWithBrowser(sceneName));
        return;
      }
      const cloudSrc = cloudVoice[sceneName];
      if (cloudSrc) {
        playPreRecorded(cloudSrc);
        return;
      }
      speakWithBrowser(sceneName);
    }

    async function speakWithVolcano(text, fallback) {
      try {
        if (!volcengineTts.apiKey) throw new Error("Volcengine API key is not configured.");
        window.speechSynthesis?.cancel();
        const response = await fetch("https://openspeech.bytedance.com/api/v3/tts/unidirectional", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Api-Key": volcengineTts.apiKey,
            "X-Api-Resource-Id": volcengineTts.resourceId,
            "X-Api-App-Key": volcengineTts.appKey,
            "X-Api-Request-Id": crypto.randomUUID()
          },
          body: JSON.stringify({
            user: { uid: "lingbao_preview" },
            req_params: {
              text,
              speaker: volcengineTts.speaker,
              audio_params: { format: "mp3", sample_rate: 24000 }
            }
          })
        });
        const raw = await response.text();
        const chunks = [];
        for (const match of raw.matchAll(/"data":"([^"]+)"/g)) {
          chunks.push(base64ToBytes(match[1]));
        }
        if (!chunks.length) throw new Error(raw.slice(0, 160));
        const blob = new Blob(chunks, { type: "audio/mpeg" });
        cloudAudio = new Audio(URL.createObjectURL(blob));
        cloudAudio.volume = .92;
        await cloudAudio.play();
      } catch (error) {
        console.warn("Volcengine TTS fallback:", error);
        fallback?.();
      }
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index++) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    function speakWithBrowser(sceneName) {
      if (!("speechSynthesis" in window)) return;
      const line = typeof speechLines[sceneName] === "function" ? speechLines[sceneName]() : speechLines[sceneName];
      if (!line) return;
      loadVoices();
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(line);
      utterance.lang = "zh-CN";
      utterance.rate = .88;
      utterance.pitch = 1.16;
      utterance.volume = .88;
      if (selectedVoice) utterance.voice = selectedVoice;
      window.speechSynthesis.speak(utterance);
    }

    function show(sceneName) {
      Object.values(scenes).forEach(scene => scene.classList.remove("active", "closing"));
      scenes[sceneName].classList.add("active");
      typeScene(sceneName);
      if (sceneName !== "plain") window.setTimeout(() => speakScene(sceneName), 180);
      if (sceneName === "plain") window.setTimeout(startWakeWordListener, 600);
      if (sceneName === "name") window.setTimeout(() => input.focus(), 300);
      if (sceneName === "confirm") {
        sequenceTimers.push(window.setTimeout(closeInterface, 5200));
      }
      if (sceneName === "plain" && DEMO_MODE === 'cache') {
        setTimeout(() => askAboutSummary('f61150c2dfbcf9f5'), 800);
      }
    }

    function closeInterface() {
      stopAudio();
      const activeScene = Object.values(scenes).find(scene => scene.classList.contains("active"));
      if (!activeScene) return;
      activeScene.classList.add("closing");
      window.setTimeout(() => {
        activeScene.classList.remove("active", "closing");
        show("plain");
      }, 980);
    }

    function revealAIIcon() {
      plainIp?.classList.add("in-use");
    }

    function hideAIIconIfIdle() {
      if (!plainIp?.classList.contains("recording") && !plainIp?.classList.contains("processing") && !plainIp?.classList.contains("answering")) {
        plainIp?.classList.remove("in-use");
      }
    }

    function setBubbleMode(mode, text = "") {
      if (!aiBubble || !thinkingDots || !bubbleText) return;
      const visible = mode !== "hidden";
      aiBubble.classList.toggle("visible", visible);
      thinkingDots.style.display = mode === "thinking" ? "flex" : "none";
      bubbleText.style.display = mode === "answer" ? "block" : "none";
      bubbleText.textContent = mode === "answer" ? text : "";
    }

    function setRecordingState(isRecording) {
      plainIp?.classList.toggle("recording", isRecording);
      plainIp?.classList.remove("listening-wave");
      window.clearTimeout(listeningWaveTimer);
      if (plainIp) {
        plainIp.classList.toggle("in-use", isRecording || plainIp.classList.contains("processing"));
        plainIp.setAttribute("aria-pressed", String(isRecording));
        plainIp.setAttribute("aria-label", isRecording ? "stop recording" : "record");
      }
      if (plainIpImage && isRecording) {
        plainIpImage.src = plainIpImage.dataset.recordingSrc;
        listeningWaveTimer = window.setTimeout(() => {
          if (plainIp?.classList.contains("recording")) {
            plainIp.classList.add("listening-wave");
          }
        }, 3000);
      }
      if (!isRecording && !plainIp?.classList.contains("processing") && plainIpImage) {
        plainIpImage.src = plainIpImage.dataset.idleSrc;
      }
    }

    function setProcessingState(isProcessing) {
      plainIp?.classList.toggle("processing", isProcessing);
      plainIp?.classList.remove("listening-wave");
      window.clearTimeout(listeningWaveTimer);
      if (plainIp) {
        plainIp.classList.toggle("in-use", isProcessing || plainIp.classList.contains("recording") || plainIp.classList.contains("answering"));
      }
      if (plainIpImage) {
        plainIpImage.src = isProcessing ? plainIpImage.dataset.processingSrc : plainIpImage.dataset.idleSrc;
      }
      if (isProcessing) {
        setBubbleMode("thinking");
      } else if (!plainIp?.classList.contains("answering")) {
        setBubbleMode("hidden");
        hideAIIconIfIdle();
      }
    }

    async function startRecording() {
      revealAIIcon();
      try {
        await window.startRecording();
        setRecordingState(true);
      } catch (error) {
        console.warn("Recording unavailable:", error);
        setRecordingState(true);
        window.setTimeout(() => {
          setRecordingState(false);
          runProcessingDemo();
        }, 4200);
      }
    }

    function runProcessingDemo() {
      if (DEMO_MODE === 'live') {
        uploadAndProcessAudio();
        return;
      }

      setProcessingState(true);
      window.clearTimeout(processingTimer);
      processingTimer = window.setTimeout(() => {
        setProcessingState(false);
        showAIAnswer("我已经听到了，正在为你整理最合适的回答。");
      }, 2600);
    }

    async function uploadAndProcessAudio() {
      setProcessingState(true);

      try {
        const filePath = window.__lastRecordingPath || '';
        const fileHash = await window.uploadAudio(filePath);
        if (!fileHash) throw new Error('Upload did not return a hash');

        let pollCount = 0;
        while (pollCount < 120) {
          await new Promise(r => setTimeout(r, 3000));
          const pollData = await window.queryUploadStatus(fileHash);

          if (pollData.status === 'done') {
            if (pollData.error) throw new Error(pollData.error);
            setProcessingState(false);

            setTimeout(() => askAboutSummary(fileHash), 500);
            return;
          }
          pollCount++;
        }

        throw new Error('Processing timed out');
      } catch (err) {
        setProcessingState(false);
        showAIAnswer("抱歉，处理出错了：" + err.message);
      }
    }

    function showAIAnswer(text) {
      plainIp?.classList.add("answering", "in-use");
      if (plainIpImage) plainIpImage.src = plainIpImage.dataset.idleSrc;
      setBubbleMode("answer", text);
      window.clearTimeout(answerTimer);
      answerTimer = window.setTimeout(() => {
        plainIp?.classList.remove("answering");
        setBubbleMode("hidden");
        hideAIIconIfIdle();
      }, 4200);
    }

    function stopRecording() {
      window.stopRecording();
      setRecordingState(false);
      if (typeof LingbaoAndroid !== 'undefined') {
        runProcessingDemo();
      }
    }

    async function toggleRecording() {
      if (plainIp?.classList.contains("recording")) {
        stopRecording();
        return;
      }
      try {
        await startRecording();
      } catch (error) {
        console.warn("Recording unavailable:", error);
        setRecordingState(false);
      }
    }

    function startWakeWordListener() {
      window.startWakeWordListener();
      window.__originalOnWakeWord = function () {
        if (!plainIp?.classList.contains("recording")) {
          startRecording();
        }
      };
    }

    function stopWakeWord() {
      window.stopWakeWordListener();
    }

    let yesNoResolver = null;
    let yesNoTimer = null;

    function listenForYesNo(callback, timeoutMs = 5000) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        setTimeout(() => callback(true), timeoutMs);
        return;
      }

      stopWakeWord();

      const recognizer = new SpeechRecognition();
      recognizer.lang = 'zh-CN';
      recognizer.interimResults = false;
      recognizer.continuous = false;

      const yesWords = ['是', '好', '可以', '对', '要', '看', '打开', '行', '嗯', '需要'];
      const noWords = ['不', '否', '不要', '算了', '不用', '不看', '不需要', '别'];

      yesNoTimer = setTimeout(() => {
        recognizer.stop();
        callback(false);
      }, timeoutMs);

      recognizer.onresult = (event) => {
        clearTimeout(yesNoTimer);
        const transcript = event.results[0][0].transcript.trim();
        console.log('Yes/No detected:', transcript);

        const isYes = yesWords.some(w => transcript.includes(w));
        const isNo = noWords.some(w => transcript.includes(w));

        if (isYes) {
          callback(true);
        } else if (isNo) {
          callback(false);
        } else {
          callback(false);
        }
      };

      recognizer.onerror = () => {
        clearTimeout(yesNoTimer);
        callback(false);
      };

      recognizer.onend = () => {
        clearTimeout(yesNoTimer);
      };

      try {
        recognizer.start();
      } catch (e) {
        clearTimeout(yesNoTimer);
        callback(false);
      }
    }

    function askAboutSummary(hash) {
      loadVoices();
      setTimeout(() => {
        const ask = () => listenForYesNo((saidYes) => {
          if (saidYes) window.open('/phone?hash=' + hash, '_blank');
        });
        if (typeof LingbaoAndroid !== 'undefined') {
          window.onTtsCompleted = ask;
          playTTS('需要查看会议总结吗？');
        } else if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance('需要查看会议总结吗？');
          utterance.lang = 'zh-CN';
          utterance.rate = 0.88;
          utterance.pitch = 1.16;
          utterance.volume = 0.88;
          if (selectedVoice) utterance.voice = selectedVoice;
          utterance.onend = ask;
          utterance.onerror = ask;
          window.speechSynthesis.speak(utterance);
        } else {
          ask();
        }
      }, 300);
    }

    function saveTitle(title) {
      setStoredName(title);
    }

    function completeName() {
      const title = input.value.trim();
      if (!title) {
        statusText.textContent = "";
        return;
      }
      saveTitle(title);
      statusText.textContent = "正在确认称呼...";
      window.setTimeout(() => show("confirm"), 360);
    }

    function clearSequence() {
      sequenceTimers.forEach(timer => window.clearTimeout(timer));
      sequenceTimers = [];
    }

    function replay() {
      clearSequence();
      stopAudio();
      statusText.textContent = "";
      show("intro");
      sequenceTimers.push(window.setTimeout(() => show("name"), 4200));
    }

    input.value = getStoredName() || "";
    if (input.value.trim()) confirmName.textContent = input.value.trim();
    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    input.addEventListener("input", () => {
      window.clearTimeout(inputTimer);
      const title = input.value.trim();
      statusText.textContent = title ? "停止输入后自动确认" : "";
      if (title) inputTimer = window.setTimeout(completeName, 900);
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        window.clearTimeout(inputTimer);
        completeName();
      }
    });

    plainIp?.addEventListener("click", event => {
      event.stopPropagation();
      toggleRecording();
    });

    plainIp?.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleRecording();
      }
    });

    document.body.addEventListener("click", () => {
      const active = Object.keys(scenes).find(key => scenes[key].classList.contains("active"));
      if (!active) return;
      speakScene(active);
    }, { once: true });

    replay();
  </script>
</body>
</html>
